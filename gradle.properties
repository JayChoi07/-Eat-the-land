# 루트 gradle.properties. 데몬 메모리를 명시하고(R-19-09) configuration cache 를 켠다(R-19-10).
# 로컬과 CI 가 같은 파일을 쓰므로 워크플로에서 별도 플래그로 덮어쓰지 않는다.

# R-19-09 — 힙을 올릴 때는 MaxMetaspaceSize 도 함께 올린다. 구체 수치는 측정으로 정한다(가이드는 4·6·8GB 중에서 고르라고만 한다).
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8

# R-19-10 — Gradle 10 에서 기본이 될 실행 모드. 아직 완전 호환이 아닌 플러그인이 있어 문제는 경고로 받는다.
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# 규칙이 아니라 AGP 가 AndroidX 의존을 쓰는 프로젝트에 요구하는 값이다.
android.useAndroidX=true
